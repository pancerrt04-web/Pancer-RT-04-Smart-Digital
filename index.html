<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warga RT 04 Pancer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; }
        .mobile-container { max-width: 480px; margin: auto; min-height: 100vh; background: #ffffff; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="font-sans antialiased text-gray-800">

<div class="mobile-container flex flex-col justify-between pb-20" x-data="rtApp()">

    <!-- HEADER -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div>
            <h1 class="font-bold text-lg">RT 04 PANCER</h1>
            <p class="text-xs text-blue-100">Portal Layanan & Informasi Warga</p>
        </div>
        <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-users text-white"></i>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="p-4 flex-grow overflow-y-auto">
        
        <!-- 1. BERANDA / HOME -->
        <template x-if="currentTab === 'home'">
            <div class="space-y-4">
                <div class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-2xl p-5 text-white shadow-lg">
                    <h2 class="text-xl font-bold mb-1">Selamat Datang, Warga!</h2>
                    <p class="text-sm opacity-90">Akses layanan administrasi dan informasi seputar RT 04 Pancer dengan mudah dari ponsel Anda.</p>
                </div>

                <!-- Quick Menu -->
                <div class="grid grid-cols-4 gap-3 text-center">
                    <button @click="currentTab = 'aduan'" class="bg-blue-50 p-3 rounded-xl flex flex-col items-center justify-center text-blue-600 hover:bg-blue-100">
                        <i class="fa-solid fa-bullhorn text-xl mb-1"></i>
                        <span class="text-xs font-medium">Aduan</span>
                    </button>
                    <button @click="currentTab = 'surat'" class="bg-emerald-50 p-3 rounded-xl flex flex-col items-center justify-center text-emerald-600 hover:bg-emerald-100">
                        <i class="fa-solid fa-envelope-open-text text-xl mb-1"></i>
                        <span class="text-xs font-medium">Surat</span>
                    </button>
                    <button @click="currentTab = 'berita'" class="bg-amber-50 p-3 rounded-xl flex flex-col items-center justify-center text-amber-600 hover:bg-amber-100">
                        <i class="fa-solid fa-newspaper text-xl mb-1"></i>
                        <span class="text-xs font-medium">Berita</span>
                    </button>
                    <button @click="currentTab = 'kegiatan'" class="bg-purple-50 p-3 rounded-xl flex flex-col items-center justify-center text-purple-600 hover:bg-purple-100">
                        <i class="fa-solid fa-calendar-days text-xl mb-1"></i>
                        <span class="text-xs font-medium">Kegiatan</span>
                    </button>
                </div>

                <!-- Info Singkat / Berita Terbaru -->
                <div>
                    <h3 class="font-bold text-gray-700 mb-3 flex items-center justify-between">
                        <span>Berita & Informasi Terbaru</span>
                        <span @click="currentTab = 'berita'" class="text-xs text-blue-600 cursor-pointer">Lihat Semua</span>
                    </h3>
                    <template x-for="(item, index) in beritaList.slice(0, 2)" :key="index">
                        <div class="bg-white border rounded-xl p-3 mb-3 shadow-sm flex gap-3 items-center">
                            <img :src="item.gambar || 'https://via.placeholder.com/150'" class="w-16 h-16 rounded-lg object-cover">
                            <div>
                                <span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-semibold" x-text="item.tanggal"></span>
                                <h4 class="font-bold text-sm mt-1" x-text="item.judul"></h4>
                                <p class="text-xs text-gray-500 line-clamp-1" x-text="item.isi"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- 2. PENGADUAN MASYARAKAT (WHATSAPP) -->
        <template x-if="currentTab === 'aduan'">
            <div class="space-y-4">
                <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl">
                    <h2 class="font-bold text-blue-800 text-sm mb-1"><i class="fa-solid fa-circle-info mr-1"></i> Layanan Aduan Warga</h2>
                    <p class="text-xs text-blue-600">Laporan Anda akan dikirim langsung secara otomatis melalui WhatsApp ke Pengurus RT 04 Pancer.</p>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Lengkap</label>
                        <input type="text" x-model="aduanForm.nama" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan nama Anda">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nomor Rumah / Blok</label>
                        <input type="text" x-model="aduanForm.alamat" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contoh: No. 12 / Blok A">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Isi Aduan / Laporan</label>
                        <textarea x-model="aduanForm.pesan" rows="4" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Tuliskan aduan atau aspirasi Anda..."></textarea>
                    </div>
                    <button @click="kirimWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-xl text-sm flex items-center justify-center gap-2 shadow-md">
                        <i class="fa-brands fa-whatsapp text-lg"></i> Kirim Aduan via WhatsApp
                    </button>
                </div>
            </div>
        </template>

        <!-- 3. BERITA INFO -->
        <template x-if="currentTab === 'berita'">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-gray-800">Berita & Pengumuman RT</h2>
                    <button @click="modalBerita = true" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow">
                        <i class="fa-solid fa-plus mr-1"></i> Tambah Berita
                    </button>
                </div>

                <div class="space-y-3">
                    <template x-for="(item, index) in beritaList" :key="index">
                        <div class="bg-white border rounded-xl p-3 shadow-sm">
                            <img :src="item.gambar" class="w-full h-40 object-cover rounded-lg mb-2">
                            <span class="text-[10px] text-gray-400" x-text="item.tanggal"></span>
                            <h3 class="font-bold text-sm text-gray-800" x-text="item.judul"></h3>
                            <p class="text-xs text-gray-600 mt-1" x-text="item.isi"></p>
                        </div>
                    </template>
                </div>

                <!-- Modal Tambah Berita -->
                <div x-show="modalBerita" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-sm rounded-2xl p-4 space-y-3">
                        <h3 class="font-bold text-gray-800">Tambah Berita Baru</h3>
                        <input type="text" x-model="newBerita.judul" placeholder="Judul Berita" class="w-full border rounded-lg p-2 text-sm">
                        <textarea x-model="newBerita.isi" placeholder="Isi berita..." rows="3" class="w-full border rounded-lg p-2 text-sm"></textarea>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Upload Foto Berita</label>
                            <input type="file" @change="uploadFileBerita($event)" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button @click="modalBerita = false" class="w-1/2 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-medium">Batal</button>
                            <button @click="simpanBerita()" class="w-1/2 bg-blue-600 text-white py-2 rounded-lg text-sm font-medium">Simpan</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- 4. KEGIATAN WARGA -->
        <template x-if="currentTab === 'kegiatan'">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-gray-800">Dokumentasi Kegiatan</h2>
                    <button @click="modalKegiatan = true" class="bg-purple-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow">
                        <i class="fa-solid fa-plus mr-1"></i> Tambah Foto
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <template x-for="(item, index) in kegiatanList" :key="index">
                        <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
                            <img :src="item.gambar" class="w-full h-32 object-cover">
                            <div class="p-2">
                                <h4 class="font-bold text-xs text-gray-800" x-text="item.nama"></h4>
                                <span class="text-[10px] text-gray-400" x-text="item.tanggal"></span>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Modal Tambah Kegiatan -->
                <div x-show="modalKegiatan" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-sm rounded-2xl p-4 space-y-3">
                        <h3 class="font-bold text-gray-800">Upload Foto Kegiatan</h3>
                        <input type="text" x-model="newKegiatan.nama" placeholder="Nama Kegiatan" class="w-full border rounded-lg p-2 text-sm">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Pilih Foto dari Perangkat</label>
                            <input type="file" @change="uploadFileKegiatan($event)" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button @click="modalKegiatan = false" class="w-1/2 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-medium">Batal</button>
                            <button @click="simpanKegiatan()" class="w-1/2 bg-purple-600 text-white py-2 rounded-lg text-sm font-medium">Simpan</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- 5. AJUAN SURAT -->
        <template x-if="currentTab === 'surat'">
            <div class="space-y-4">
                <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl">
                    <h2 class="font-bold text-emerald-800 text-sm mb-1"><i class="fa-solid fa-file-lines mr-1"></i> Layanan Pengajuan Surat</h2>
                    <p class="text-xs text-emerald-600">Pilih jenis surat yang ingin diajukan. Data akan langsung dikirimkan ke pengurus RT.</p>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Jenis Surat</label>
                        <select x-model="suratForm.jenis" class="w-full border rounded-lg p-2.5 text-sm bg-white outline-none">
                            <option value="Surat Pengantar Domisili">Surat Pengantar Domisili</option>
                            <option value="Surat Keterangan Tidak Mampu (SKTM)">Surat Keterangan Tidak Mampu (SKTM)</option>
                            <option value="Surat Pengantar Nikah">Surat Pengantar Nikah</option>
                            <option value="Surat Keterangan Usaha">Surat Keterangan Usaha</option>
                            <option value="Surat Pengurusan KTP & KK">Surat Pengurusan KTP & KK</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Lengkap Pemohon</label>
                        <input type="text" x-model="suratForm.nama" class="w-full border rounded-lg p-2.5 text-sm outline-none" placeholder="Sesuai KTP">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">NIK (Nomor Induk Kependudukan)</label>
                        <input type="text" x-model="suratForm.nik" class="w-full border rounded-lg p-2.5 text-sm outline-none" placeholder="16 digit NIK">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Keperluan / Keterangan Tambahan</label>
                        <textarea x-model="suratForm.keperluan" rows="3" class="w-full border rounded-lg p-2.5 text-sm outline-none" placeholder="Contoh: Untuk persyaratan kerja..."></textarea>
                    </div>
                    <button @click="kirimAjuanSurat()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl text-sm shadow-md">
                        Ajukan Permohonan Surat
                    </button>
                </div>
            </div>
        </template>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bg-white border-t border-gray-200 fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto flex justify-around p-2 z-40 shadow-lg">
        <button @click="currentTab = 'home'" :class="currentTab === 'home' ? 'text-blue-600' : 'text-gray-400'" class="flex flex-col items-center flex-1">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-1">Beranda</span>
        </button>
        <button @click="currentTab = 'aduan'" :class="currentTab === 'aduan' ? 'text-blue-600' : 'text-gray-400'" class="flex flex-col items-center flex-1">
            <i class="fa-solid fa-bullhorn text-lg"></i>
            <span class="text-[10px] mt-1">Aduan</span>
        </button>
        <button @click="currentTab = 'surat'" :class="currentTab === 'surat' ? 'text-blue-600' : 'text-gray-400'" class="flex flex-col items-center flex-1">
            <i class="fa-solid fa-envelope text-lg"></i>
            <span class="text-[10px] mt-1">Surat</span>
        </button>
        <button @click="currentTab = 'berita'" :class="currentTab === 'berita' ? 'text-blue-600' : 'text-gray-400'" class="flex flex-col items-center flex-1">
            <i class="fa-solid fa-newspaper text-lg"></i>
            <span class="text-[10px] mt-1">Berita</span>
        </button>
        <button @click="currentTab = 'kegiatan'" :class="currentTab === 'kegiatan' ? 'text-blue-600' : 'text-gray-400'" class="flex flex-col items-center flex-1">
            <i class="fa-solid fa-images text-lg"></i>
            <span class="text-[10px] mt-1">Kegiatan</span>
        </button>
    </nav>

</div>

<!-- LOGIKA JAVASCRIPT & JSONBIN -->
<script>
    // KONFIGURASI JSONBIN.IO ANDA (Ganti dengan Bin ID dan Master Key Anda)
    const BIN_ID = 'MASUKKAN_BIN_ID_ANDA_DISINI'; 
    const API_KEY = 'MASUKKAN_MASTER_KEY_ANDA_DISINI';
    const NOMOR_WA_RT = '6287880373803'; // Ganti dengan nomor WhatsApp pengurus RT (awali 62)

    function rtApp() {
        return {
            currentTab: 'home',
            modalBerita: false,
            modalKegiatan: false,
            
            beritaList: [
                { judul: "Jadwal Kerja Bakti RT 04", isi: "Diharapkan kehadiran seluruh warga pada hari Minggu pagi pukul 07.00 WIB.", tanggal: "27 Juli 2026", gambar: "https://via.placeholder.com/300x150" }
            ],
            kegiatanList: [
                { nama: "Kerja Bakti Bulanan", tanggal: "20 Juli 2026", gambar: "https://via.placeholder.com/300x200" }
            ],

            aduanForm: { nama: '', alamat: '', pesan: '' },
            suratForm: { jenis: 'Surat Pengantar Domisili', nama: '', nik: '', keperluan: '' },
            
            newBerita: { judul: '', isi: '', gambar: '', tanggal: '27 Juli 2026' },
            newKegiatan: { nama: '', gambar: '', tanggal: '27 Juli 2026' },

            init() {
                this.loadFromJSONBin();
            },

            // Fungsi Kirim WhatsApp Otomatis
            kirimWhatsApp() {
                if(!this.aduanForm.nama || !this.aduanForm.pesan) {
                    alert('Mohon lengkapi nama dan isi aduan!');
                    return;
                }
                let teks = `*ADUAN WARGA RT 04 PANCER*%0A%0A*Nama:* ${this.aduanForm.nama}%0A*Alamat:* ${this.aduanForm.alamat}%0A*Pesan:* ${this.aduanForm.pesan}`;
                window.open(`https://wa.me/${NOMOR_WA_RT}?text=${teks}`, '_blank');
            },

            // Konversi File Gambar Perangkat ke Base64 (Berita)
            uploadFileBerita(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => { this.newBerita.gambar = e.target.result; };
                    reader.readAsDataURL(file);
                }
            },

            // Konversi File Gambar Perangkat ke Base64 (Kegiatan)
            uploadFileKegiatan(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => { this.newKegiatan.gambar = e.target.result; };
                    reader.readAsDataURL(file);
                }
            },

            simpanBerita() {
                if(!this.newBerita.judul || !this.newBerita.isi) {
                    alert('Judul dan isi berita wajib diisi!');
                    return;
                }
                this.beritaList.unshift({...this.newBerita});
                this.newBerita = { judul: '', isi: '', gambar: '', tanggal: '27 Juli 2026' };
                this.modalBerita = false;
                this.saveToJSONBin();
            },

            simpanKegiatan() {
                if(!this.newKegiatan.nama) {
                    alert('Nama kegiatan wajib diisi!');
                    return;
                }
                this.kegiatanList.unshift({...this.newKegiatan});
                this.newKegiatan = { nama: '', gambar: '', tanggal: '27 Juli 2026' };
                this.modalKegiatan = false;
                this.saveToJSONBin();
            },

            kirimAjuanSurat() {
                if(!this.suratForm.nama || !this.suratForm.nik) {
                    alert('Mohon lengkapi Nama dan NIK Anda!');
                    return;
                }
                let teks = `*PENGAJUAN SURAT Warga*%0A%0A*Jenis:* ${this.suratForm.jenis}%0A*Nama:* ${this.suratForm.nama}%0A*NIK:* ${this.suratForm.nik}%0A*Keperluan:* ${this.suratForm.keperluan}`;
                window.open(`https://wa.me/${NOMOR_WA_RT}?text=${teks}`, '_blank');
            },

            // Integrasi JSONBin.io (Simpan Data Online)
            saveToJSONBin() {
                if (BIN_ID === 'MASUKKAN_BIN_ID_ANDA_DISINI') return; // Skip jika belum diset
                let data = { berita: this.beritaList, kegiatan: this.kegiatanList };
                fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(data)
                }).catch(err => console.error('Gagal menyimpan ke database:', err));
            },

            loadFromJSONBin() {
                if (BIN_ID === 'MASUKKAN_BIN_ID_ANDA_DISINI') return;
                fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                })
                .then(res => res.json())
                .then(data => {
                    if(data.record) {
                        if(data.record.berita) this.beritaList = data.record.berita;
                        if(data.record.kegiatan) this.kegiatanList = data.record.kegiatan;
                    }
                })
                .catch(err => console.error('Gagal memuat database:', err));
            }
        }
    }
</script>

</body>
</html>
