<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan Warga RT 04</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-20">

    <!-- HEADER / NAVBAR -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold">RT 04 - Portal Warga</h1>
                <p class="text-xs text-blue-100">Kelurahan/Wilayah Setempat</p>
            </div>
            <div class="text-right text-xs bg-blue-700 px-2 py-1 rounded">
                <span class="block font-semibold">Ketua RT</span>
                <span>Bpk. Hj. Syaeful Bahri</span>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- KARTU PENGURUS RT -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">Pengurus RT 04</h2>
            <div class="grid grid-cols-3 gap-2 text-center text-xs">
                <div class="bg-slate-50 p-2 rounded border">
                    <i class="fa-solid fa-user-tie text-blue-600 mb-1 text-base"></i>
                    <p class="font-bold">Ketua</p>
                    <p class="text-slate-600 truncate">Hj. Syaeful B.</p>
                </div>
                <div class="bg-slate-50 p-2 rounded border">
                    <i class="fa-solid fa-user-pen text-blue-600 mb-1 text-base"></i>
                    <p class="font-bold">Sekretaris</p>
                    <p class="text-slate-600 truncate">Ardi</p>
                </div>
                <div class="bg-slate-50 p-2 rounded border">
                    <i class="fa-solid fa-wallet text-blue-600 mb-1 text-base"></i>
                    <p class="font-bold">Bendahara</p>
                    <p class="text-slate-600 truncate">Nurchadi</p>
                </div>
            </div>
        </section>

        <!-- MENU UTAMA -->
        <section class="grid grid-cols-3 gap-3">
            <button onclick="switchTab('layanan')" class="menu-btn bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center text-center hover:bg-blue-50 transition active:border-blue-500" data-target="layanan">
                <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-1">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
                <span class="text-xs font-semibold">Ajuan Surat</span>
            </button>
            <button onclick="switchTab('aduan')" class="menu-btn bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center text-center hover:bg-blue-50 transition" data-target="aduan">
                <div class="w-10 h-10 bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-1">
                    <i class="fa-solid fa-bullhorn"></i>
                </div>
                <span class="text-xs font-semibold">Aduan Warga</span>
            </button>
            <button onclick="switchTab('berita')" class="menu-btn bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center text-center hover:bg-blue-50 transition" data-target="berita">
                <div class="w-10 h-10 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-1">
                    <i class="fa-solid fa-newspaper"></i>
                </div>
                <span class="text-xs font-semibold">Berita & Kegiatan</span>
            </button>
        </section>

        <!-- SECTION: AJUAN SURAT -->
        <section id="tab-layanan" class="tab-content bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-md font-bold mb-3 text-blue-600 border-b pb-2"><i class="fa-solid fa-file-invoice mr-2"></i>Form Pengajuan Surat</h2>
            <form id="formSurat" onsubmit="kirimSurat(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Jenis Surat</label>
                    <select id="jenisSurat" class="w-full border rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
                        <option value="">-- Pilih Jenis Surat --</option>
                        <option value="Surat Pengantar Domisili">Surat Pengantar Domisili</option>
                        <option value="Surat Keterangan Tidak Mampu">Surat Keterangan Tidak Mampu</option>
                        <option value="Surat Pengantar Nikah">Surat Pengantar Nikah</option>
                        <option value="Surat Keterangan Usaha">Surat Keterangan Usaha</option>
                        <option value="Surat Pengurusan KTP & KK">Surat Pengurusan KTP & KK</option>
                    </select>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="namaSurat" class="w-full border rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nama lengkap warga" required>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Alamat Domisili di RT 04</label>
                    <textarea id="alamatSurat" rows="2" class="w-full border rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contoh: Jl. Merpati No. 12" required></textarea>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Keperluan / Keterangan Tambahan</label>
                    <input type="text" id="keteranganSurat" class="w-full border rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Opsional">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Kirim Pengajuan via WhatsApp
                </button>
            </form>
        </section>

        <!-- SECTION: ADUAN MASYARAKAT -->
        <section id="tab-aduan" class="tab-content bg-white p-4 rounded-xl shadow-sm border border-slate-200 hidden">
            <h2 class="text-md font-bold mb-3 text-red-600 border-b pb-2"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Layanan Aduan Warga</h2>
            <form id="formAduan" onsubmit="kirimAduan(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Nama Pelapor</label>
                    <input type="text" id="namaAduan" class="w-full border rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-red-500 outline-none" placeholder="Nama Anda" required>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Nomor Rumah / Alamat</label>
                    <input type="text" id="alamatAduan" class="w-full border rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-red-500 outline-none" placeholder="Contoh: Blok B / No. 05" required>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Isi Laporan / Aduan</label>
                    <textarea id="pesanAduan" rows="3" class="w-full border rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-red-500 outline-none" placeholder="Sampaikan aduan atau aspirasi Anda di sini..." required></textarea>
                </div>
                <button type="submit" class="w-full bg-red-600 text-white font-semibold py-2.5 rounded-lg hover:bg-red-700 transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Kirim Aduan via WhatsApp
                </button>
            </form>
        </section>

        <!-- SECTION: BERITA & KEGIATAN -->
        <section id="tab-berita" class="tab-content bg-white p-4 rounded-xl shadow-sm border border-slate-200 hidden">
            <h2 class="text-md font-bold mb-3 text-green-600 border-b pb-2"><i class="fa-solid fa-bullhorn mr-2"></i>Berita & Kegiatan RT 04</h2>
            
            <!-- Form Upload Berita -->
            <form id="formBerita" onsubmit="uploadBerita(event)" class="space-y-3 text-sm mb-6 bg-slate-50 p-3 rounded-lg border">
                <h3 class="font-bold text-slate-700 text-xs uppercase">Tambah Berita / Kegiatan Baru</h3>
                <div>
                    <label class="block font-medium text-slate-700 mb-1 text-xs">Judul Kegiatan</label>
                    <input type="text" id="judulBerita" class="w-full border rounded-lg p-2 bg-white text-xs outline-none" placeholder="Contoh: Kerja Bakti Minggu Ini" required>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1 text-xs">Isi Berita / Keterangan</label>
                    <textarea id="isiBerita" rows="2" class="w-full border rounded-lg p-2 bg-white text-xs outline-none" placeholder="Deskripsi lengkap..." required></textarea>
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1 text-xs">Foto Kegiatan</label>
                    <input type="file" id="fotoBerita" accept="image/*" class="w-full border rounded-lg p-1 bg-white text-xs file:mr-4 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100" required>
                </div>
                <button type="submit" id="btnUpload" class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg text-xs hover:bg-green-700 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload & Simpan ke Database
                </button>
            </form>

            <!-- Daftar Feed Berita -->
            <div id="feedBerita" class="space-y-4">
                <p class="text-center text-xs text-slate-400">Memuat data dari database...</p>
            </div>
        </section>

    </main>

    <!-- FOOTER NAVIGASI MOBILE BAWAH -->
    <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 shadow-lg">
        <div class="grid grid-cols-3 text-center py-2">
            <button onclick="switchTab('layanan')" class="nav-icon text-blue-600 flex flex-col items-center" data-target="layanan">
                <i class="fa-solid fa-file-lines text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Surat</span>
            </button>
            <button onclick="switchTab('aduan')" class="nav-icon text-slate-400 flex flex-col items-center" data-target="aduan">
                <i class="fa-solid fa-bullhorn text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Aduan</span>
            </button>
            <button onclick="switchTab('berita')" class="nav-icon text-slate-400 flex flex-col items-center" data-target="berita">
                <i class="fa-solid fa-newspaper text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Kegiatan</span>
            </button>
        </div>
    </nav>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // KONFIGURASI JSONBIN.IO ANDA
        // Ganti BIN_ID dan MASTER_KEY dengan milik Anda setelah membuat bin di jsonbin.io
        const JSONBIN_BIN_ID = "6a67664fda38895dfe968e8b"; 
        const JSONBIN_MASTER_KEY = "$2a$10$QIyv.AmUFINQ/eg510GxK.RId13bJ8C1jKblNJ9KyL0t6T0iflJhu";
        const NO_WA_RT = "6287880373803";

        // Tab Navigation
        function switchTab(targetId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + targetId).classList.remove('hidden');

            document.querySelectorAll('.nav-icon').forEach(el => {
                el.classList.remove('text-blue-600');
                el.classList.add('text-slate-400');
                if(el.getAttribute('data-target') === targetId) {
                    el.classList.add('text-blue-600');
                    el.classList.remove('text-slate-400');
                }
            });
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // 1. Fungsi Kirim Surat ke WhatsApp (Tanpa NIK/Identitas, hanya Nama & Alamat)
        function kirimSurat(e) {
            e.preventDefault();
            const jenis = document.getElementById('jenisSurat').value;
            const nama = document.getElementById('namaSurat').value;
            const alamat = document.getElementById('alamatSurat').value;
            const ket = document.getElementById('keteranganSurat').value;

            const pesan = `Halo Pengurus RT 04,\n\nSaya ingin mengajukan permohonan surat:\n` +
                          `* Jenis Surat: ${jenis}\n` +
                          `* Nama Lengkap: ${nama}\n` +
                          `* Alamat: ${alamat}\n` +
                          `* Keterangan: ${ket || '-'}\n\n` +
                          `Mohon bantuannya untuk diproses. Terima kasih.`;

            const urlWa = `https://wa.me/${NO_WA_RT}?text=${encodeURIComponent(pesan)}`;
            window.open(urlWa, '_blank');
        }

        // 2. Fungsi Kirim Aduan ke WhatsApp
        function kirimAduan(e) {
            e.preventDefault();
            const nama = document.getElementById('namaAduan').value;
            const alamat = document.getElementById('alamatAduan').value;
            const pesan = document.getElementById('pesanAduan').value;

            const textWa = `*ADUAN WARGA RT 04*\n\n` +
                           `* Nama: ${nama}\n` +
                           `* Alamat/No. Rumah: ${alamat}\n` +
                           `* Isi Aduan:\n${pesan}`;

            const urlWa = `https://wa.me/${NO_WA_RT}?text=${encodeURIComponent(textWa)}`;
            window.open(urlWa, '_blank');
        }

        // 3. Sistem Berita & Kegiatan dengan JSONBin.io & Konversi Gambar ke Base64
        async function ambilBerita() {
            const feedContainer = document.getElementById('feedBerita');
            if (JSONBIN_BIN_ID.includes("MASUKKAN")) {
                feedContainer.innerHTML = `<p class="text-center text-xs text-red-500">Konfigurasi JSONBin belum diatur di dalam kode JavaScript.</p>`;
                return;
            }

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
                });
                const result = await response.json();
                const listData = result.record.data || [];

                if (listData.length === 0) {
                    feedContainer.innerHTML = `<p class="text-center text-xs text-slate-400">Belum ada berita atau kegiatan yang diunggah.</p>`;
                    return;
                }

                feedContainer.innerHTML = "";
                listData.reverse().forEach(item => {
                    feedContainer.innerHTML += `
                        <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
                            <img src="${item.foto}" alt="Foto Kegiatan" class="w-full h-40 object-cover">
                            <div class="p-3">
                                <span class="text-[10px] text-slate-400 block mb-1">${item.tanggal}</span>
                                <h3 class="font-bold text-slate-800 text-sm mb-1">${item.judul}</h3>
                                <p class="text-xs text-slate-600">${item.isi}</p>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                feedContainer.innerHTML = `<p class="text-center text-xs text-red-500">Gagal memuat database berita.</p>`;
            }
        }

        async function uploadBerita(e) {
            e.preventDefault();
            if (JSONBIN_BIN_ID.includes("MASUKKAN")) {
                alert("Harap masukkan JSONBin Bin ID dan Master Key terlebih dahulu!");
                return;
            }

            const btn = document.getElementById('btnUpload');
            btn.innerText = "Mengunggah & Menyimpan...";
            btn.disabled = true;

            const judul = document.getElementById('judulBerita').value;
            const isi = document.getElementById('isiBerita').value;
            const fileInput = document.getElementById('fotoBerita').files[0];

            const reader = new FileReader();
            reader.readAsDataURL(fileInput);
            reader.onload = async function() {
                const base64Image = reader.result;
                const tanggalBaru = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

                try {
                    // Ambil data lama dulu
                    const getRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                        headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
                    });
                    const getResult = await getRes.json();
                    let currentData = getResult.record.data || [];

                    // Tambah data baru
                    currentData.push({
                        judul: judul,
                        isi: isi,
                        foto: base64Image,
                        tanggal: tanggalBaru
                    });

                    // Simpan kembali ke JSONBin
                    const putRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': JSONBIN_MASTER_KEY
                        },
                        body: JSON.stringify({ data: currentData })
                    });

                    if (putRes.ok) {
                        alert("Berita & Kegiatan berhasil disimpan secara permanen ke database!");
                        document.getElementById('formBerita').reset();
                        ambilBerita();
                    } else {
                        alert("Gagal menyimpan ke database.");
                    }
                } catch (error) {
                    alert("Terjadi kesalahan koneksi.");
                } finally {
                    btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Upload & Simpan ke Database`;
                    btn.disabled = false;
                }
            };
        }

        // Muat data berita saat halaman dibuka
        window.onload = function() {
            ambilBerita();
        };
    </script>
</body>
</html>
